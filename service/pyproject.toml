[project]
name = "cursor-buddy"
version = "0.1.0"
description = "Mac Buddy Service for Cursor Buddy (Waveshare ESP32 pager)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
]

[project.scripts]
cursor-buddy = "buddy.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["buddy*"]

[tool.setuptools.package-data]
buddy = ["static/*"]
