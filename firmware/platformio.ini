; Waveshare ESP32-S3-Touch-LCD-2.1
; Install PlatformIO: https://platformio.org/
; Flash: pio run -t upload
; NOTE: Merge Waveshare's official display/touch BSP if the generic GFX
; driver below does not bring up your panel — pin map matches their wiki.

[env:waveshare-esp32s3-touch-lcd-2.1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -I include
lib_deps =
  bblanchon/ArduinoJson @ ^7
  links2004/WebSockets @ ^2.4.1
  moononournation/GFX Library for Arduino @ ^1.4.7
  lvgl/lvgl @ ^8.3.11
